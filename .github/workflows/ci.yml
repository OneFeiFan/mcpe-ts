name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 必须是 `pnpm run ci`：`pnpm ci` 是 pnpm 自带的子命令（等于 install --frozen-lockfile），
      # 会**盖过** package.json 里的同名脚本 —— 在这里写 `pnpm ci` 的话这一步只会再装一遍依赖、
      # 永远返回 0，等于整个 CI 什么都没验。
      - name: Verify
        run: pnpm run ci
